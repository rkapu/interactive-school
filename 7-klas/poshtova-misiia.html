<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Поштова місія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a mail client on a sorting-desk ground; mission brief on the left, the letter window on the right, answers as chips below. Airmail stripe is the one bold element. */
:root{
  --bg:#e9edf3; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#1b2231; --muted:#5a6477; --line:#d3d9e3;
  --red:#cf3a2c; --blue:#1d4ea3; --ok:#18804a; --ok-bg:#e3f4ea; --bad:#b8322a; --bad-bg:#fbe7e5; --focus:#1d4ea3;
  --f-display:"Unbounded","Rubik",system-ui,sans-serif; --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1a202c; --surface-2:#222a38; --ink:#e7ebf2; --muted:#9aa3b4; --line:#2e3748;
  --red:#ee6b5d; --blue:#7aa2ee; --ok:#52c688; --ok-bg:#16301f; --bad:#f0776a; --bad-bg:#3a1c1a; --focus:#7aa2ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202c; --surface-2:#222a38; --ink:#e7ebf2; --muted:#9aa3b4; --line:#2e3748;
  --red:#ee6b5d; --blue:#7aa2ee; --ok:#52c688; --ok-bg:#16301f; --bad:#f0776a; --bad-bg:#3a1c1a; --focus:#7aa2ee; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:20px}
.home{margin-left:8px;font-size:14px;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none}
.home:hover{color:var(--ink);border-color:var(--blue)}
.themebtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px}
.themebtn:hover{border-color:var(--blue)}
.themebtn svg{width:16px;height:16px}
.barright{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.linkout{font-family:var(--f-mono);font-size:13px}
.at{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:20px}
.track{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:30px;height:22px;border-radius:3px;border:1.5px solid var(--line);background:var(--surface);position:relative;font-size:11px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.pip.done{border-color:var(--ok);color:var(--ok)}
.pip.now{border-color:var(--blue);color:var(--blue);font-weight:600}
.score{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* game grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.brief h2{font-size:22px}
.brief p{margin:0}
.stamp{position:absolute;top:14px;right:14px;width:62px;height:72px;border:2px dashed var(--red);border-radius:4px;display:grid;place-items:center;text-align:center;color:var(--red);font-family:var(--f-display);font-size:11px;line-height:1.2;transform:rotate(6deg)}
.stamp b{display:block;font-size:22px}
.brief .kind{padding-right:78px}
.hint{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--muted)}
.hint .mono{color:var(--ink)}

/* mail window */
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.air{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,var(--surface) 14px 22px,var(--blue) 22px 36px,var(--surface) 36px 44px)}
.win-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.row{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);min-height:44px}
.row .k{color:var(--muted);font-size:14px}
.row .v{min-width:0;overflow-wrap:anywhere}
.row.active{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--blue)}
.ph{color:var(--muted);font-style:italic}
.bodyrow{padding:16px;min-height:110px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.bodyrow.active{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px}
.addr .lg{color:var(--blue)} .addr .sym{color:var(--red);font-weight:600} .addr .dm{color:var(--ok)}
.log{padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.log li{margin:0}
.log ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.folders{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:220px}
@media (max-width:520px){.folders{grid-template-columns:minmax(0,1fr)}}
.side{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.side div{padding:6px 10px;border-radius:6px;font-size:14px}
.side .hl{background:var(--ok-bg);color:var(--ok);font-weight:600}
.fold-main{padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* answer panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.q{font-weight:600;font-size:17px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;transition:border-color .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:not-allowed;opacity:.55;text-decoration:line-through}
.opt.right{border-color:var(--ok);background:var(--ok-bg);opacity:1;text-decoration:none}
.fb{border-radius:8px;padding:10px 14px;font-size:15px}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.primary{align-self:flex-start;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-weight:600;font-size:16px}
[data-theme="dark"] .primary{color:#0f1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#0f1420}}
.primary:hover{filter:brightness(1.08)}

/* flying envelope */
.fly{position:fixed;left:50%;top:55%;font-size:44px;pointer-events:none;animation:fly .9s ease-in forwards;z-index:5}
@keyframes fly{0%{transform:translate(-50%,0) rotate(0);opacity:1}100%{transform:translate(40vw,-60vh) rotate(-25deg);opacity:0}}

/* start + end */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hero-in{padding:28px 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
@media (max-width:760px){.hero-in{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(28px,5vw,44px);font-weight:800}
.hero p{margin:0;max-width:60ch;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:8px}
.form input{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);max-width:320px;width:100%}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mlist li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;font-size:15px;padding:8px 10px;border-radius:6px;background:var(--surface-2)}
.mlist .n{font-family:var(--f-display);color:var(--red);font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.post{width:150px;height:150px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-items:center;text-align:center;transform:rotate(-8deg);font-family:var(--f-display);flex:none}
.post b{font-size:34px;display:block;font-variant-numeric:tabular-nums}
.post span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.result{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.miss{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.miss li{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:14px}
.miss .ans{color:var(--ok);font-weight:600}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.shake,.fly{animation:none}.fly{display:none}}

/* gmail stage */
.gm{background:var(--surface);border:2px solid var(--red);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.gm h3{font-size:18px;display:flex;align-items:center;gap:10px}
.gm-badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border-radius:999px;padding:3px 10px;font-family:var(--f-body);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:1.5px solid transparent}
.task input{width:22px;height:22px;margin:1px 0 0;flex:none;cursor:pointer}
.task.done{border-color:var(--ok);background:var(--ok-bg)}
.task.done span{color:var(--ok)}
.copies{display:flex;flex-wrap:wrap;gap:8px}
.copy{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.copy:hover{border-color:var(--blue)}
.copy.ok{border-color:var(--ok);color:var(--ok)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ghost{background:transparent;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.cfg{background:var(--surface-2);border-radius:8px;padding:10px 14px}
.cfg summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.cfg .form{margin-top:10px}
.final{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.final li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--surface-2);font-size:15px}
.final .st{font-weight:600;min-width:92px}
.final .y{color:var(--ok)} .final .n{color:var(--bad)}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===== НАЛАШТУВАННЯ ДЛЯ ВЧИТЕЛЯ =====
   Змініть ці значення один раз (відкрийте файл у Блокноті), і вони будуть на всіх комп'ютерах.
   Також їх можна змінити на стартовому екрані гри в розділі «Налаштування для вчителя». */
var CONFIG = {
  teacherName: "Олена Петрівна",           // як записати в контактах
  teacherGreeting: "Олено Петрівно",       // звертання в листі (кличний відмінок)
  teacherEmail: "olena.petrivna@example.com",   // адреса вчителя
  groupEmail: "7a-klas@example.com",            // адреса групи класу
  className: "7-А"
};
(function(){
var CHK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
var ENV='<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1d4ea3" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2" fill="#ffffff"/><path d="m2 7 10 7 10-7"/></svg>';
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

/* світла/темна тема — спільна з рештою сайту (той самий ключ, що й на головній) */
var ROOT=document.documentElement;
try{var th=localStorage.getItem("interactive-school-theme");if(th==="dark"||th==="light")ROOT.setAttribute("data-theme",th);}catch(e){}
function curTheme(){var t=ROOT.getAttribute("data-theme");if(t==="dark"||t==="light")return t;return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeBtn(){var d=curTheme()==="dark";return '<button class="themebtn" type="button" id="themeb" aria-label="'+(d?"Увімкнути світлу тему":"Увімкнути темну тему")+'">'+(d?SUN:MOON)+'<span>'+(d?"Світла тема":"Темна тема")+'</span></button>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#themeb");if(!b)return;var n=curTheme()==="dark"?"light":"dark";ROOT.setAttribute("data-theme",n);try{localStorage.setItem("interactive-school-theme",n);}catch(err){}b.outerHTML=themeBtn();});

/* teacher overrides saved on this computer */
var CFG=Object.assign({},CONFIG);
try{var sv=JSON.parse(localStorage.getItem("misiia-config")||"null");if(sv)Object.assign(CFG,sv);}catch(e){}
/* налаштування з посилання вчителя: ?t=Ім'я&g=Звертання&e=адреса&grp=адреса_групи&c=клас */
var PKEYS={t:"teacherName",g:"teacherGreeting",e:"teacherEmail",grp:"groupEmail",c:"className"};
var FROM_LINK=false;
try{var qs=new URLSearchParams(location.search);Object.keys(PKEYS).forEach(function(k){var v=qs.get(k);if(v&&v.trim()){CFG[PKEYS[k]]=v.trim();FROM_LINK=true;}});}catch(e){}
function studentLink(c){var base=location.href.split("#")[0].split("?")[0];var p=[];Object.keys(PKEYS).forEach(function(k){var v=c[PKEYS[k]];if(v)p.push(k+"="+encodeURIComponent(v));});return base+"?"+p.join("&");}

function splitMail(m){var i=m.indexOf("@");return i<0?[m,""]:[m.slice(0,i),m.slice(i+1)];}
function swap2(str){var p=str.split(".");var w=p[0];if(w.length<3)return str+"m";p[0]=w[0]+w[2]+w[1]+w.slice(3);return p.join(".");}
function wrongs(m){
  var a=splitMail(m),lg=a[0],dm=a[1];
  var noAt=lg+"."+dm;
  var typo=lg+"@"+swap2(dm);
  var sp=lg.indexOf(".")>0?lg.replace("."," ")+"@"+dm:lg.slice(0,Math.ceil(lg.length/2))+" "+lg.slice(Math.ceil(lg.length/2))+"@"+dm;
  return {noAt:noAt,typo:typo,space:sp};
}
function first(n){return n.split(" ")[0];}

function buildMissions(){
  var T=CFG.teacherEmail,G=CFG.groupEmail,TN=CFG.teacherName,TG=CFG.teacherGreeting||CFG.teacherName,wt=wrongs(T),gd=splitMail(G)[1]||"school.edu.ua";
  var mate="sofia.bondar@"+gd;
  return [
  {type:"contact",train:true,title:"Вчитель у контактах",brief:"Спочатку додай вчителя до своїх контактів. Тоді не треба буде щоразу вводити адресу — Gmail сам її підкаже.",
   hint:'Адреса вчителя: <span class="mono">'+esc(T)+'</span>',
   steps:[
    {field:"where",prompt:"Де в Google зберігаються адреси людей, яким ти пишеш?",options:[
      {t:"Google Контакти (адресна книга)",ok:true,why:"Контакти — це адресна книга: імена та адреси людей, з якими ти листуєшся."},
      {t:"Папка «Чернетки»",why:"У Чернетках лежать недописані листи, а не адреси."},
      {t:"Папка «Кошик»",why:"У Кошику — видалені листи."}]},
    {field:"cname",prompt:"Як підписати контакт, щоб легко його знайти?",options:[
      {t:TN+" — вчитель інформатики",ok:true,why:"Ім'я і предмет: одразу зрозуміло, хто це."},
      {t:"вчитель",why:"У тебе багато вчителів — з такого підпису незрозуміло, хто це."},
      {t:"контакт 1",why:"Через тиждень ти не згадаєш, чия це адреса."}]},
    {field:"cemail",prompt:"Яку адресу записати в контакт?",options:[
      {t:T,ok:true,why:"Логін, символ @ і адреса сервісу — усе правильно."},
      {t:wt.noAt,why:"Бракує символу @ між логіном і адресою сервісу."},
      {t:wt.typo,why:"Придивись: у назві сервісу переставлені літери. Лист на таку адресу не дійде."},
      {t:wt.space,why:"В адресі електронної пошти не буває пробілів."}]}
   ],
   gmail:{title:"Додай вчителя в Google Контакти",tasks:[
     "Відкрий свою пошту Gmail.",
     "Угорі праворуч натисни кнопку «Додатки Google» (квадрат з 9 крапок) і вибери «Контакти».",
     "Натисни «Створити контакт».",
     "Введи ім'я «"+TN+"» і адресу "+T+".",
     "Натисни «Зберегти»."],
     copies:[["Скопіювати адресу",T],["Скопіювати ім'я",TN]]}},

  {type:"compose",train:true,title:"Пробний лист учителю",brief:"Тренування: склади тут зразковий лист за правилами етикету, а потім перенеси його в Gmail і надішли. Тут можна копіювати.",
   hint:"Вчитель уже є у твоїх контактах.",
   steps:[
    {field:"to",prompt:"Кому надіслати лист?",options:[
      {t:TN+" ("+T+") — з контактів",ok:true,plain:true,why:"Вибрати адресу з контактів — найшвидше й без помилок."},
      {t:G,why:"Це адреса групи всього класу. Лист отримають усі однокласники, а не вчитель."},
      {t:wt.typo,why:"У назві сервісу помилка — лист не дійде."}]},
    {field:"subject",prompt:"Яку тему вказати?",options:[
      {t:"Практична робота «Електронна пошта» — {name}, {cls}",ok:true,why:"Тема пояснює зміст, і вчитель одразу бачить, чия це робота."},
      {t:"(без теми)",why:"Лист без теми легко загубити. За етикетом тему вказують завжди."},

var MISSIONS=buildMissions();
function total(){return MISSIONS.reduce(function(s,m){return s+m.steps.length;},0);}

var $=function(s){return document.querySelector(s);};
var app=$("#app");
var S;
function fresh(){return {screen:"start",name:S&&S.name||"",cls:S&&S.cls||CFG.className,mi:0,si:0,stage:"steps",gm:[],gmDone:{},order:{},tried:[],fb:null,done:{},score:0,misses:[]};}
function nm(){return S.name.trim()||"Учень";}
function cls(){return (S.cls||"").trim()||CFG.className;}
function fill(t){return t.replace(/\{name\}/g,nm()).replace(/\{cls\}/g,cls());}
function addr(t){var p=t.split("@");if(p.length<2)return esc(t);return '<span class="lg">'+esc(p[0])+'</span>'+p.slice(1).map(function(x){return '<span class="sym">@</span><span class="dm">'+esc(x)+'</span>';}).join("");}
function optLabel(st,o){if((st.field==="to"||st.field==="cemail")&&!o.plain)return '<span class="mono addr">'+addr(o.t)+'</span>';return esc(fill(o.t)).replace(/\n+/g," ");}
function shuffled(n,key){if(!S.order[key]){var a=[];for(var i=0;i<n;i++)a.push(i);for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t;}S.order[key]=a;}return S.order[key];}
function chosen(mi,field){var m=MISSIONS[mi];for(var i=0;i<m.steps.length;i++){if(m.steps[i].field===field&&S.done[mi+"."+i]!==undefined)return m.steps[i].options[S.done[mi+"."+i]];}return null;}
function stepsDone(){return S.si>=MISSIONS[S.mi].steps.length;}

function topbar(){
  var pips=MISSIONS.map(function(m,i){var c=i<S.mi?"done":(i===S.mi&&S.screen==="play"?"now":"");return '<div class="pip '+c+'" title="'+esc(m.title)+'">'+(i<S.mi?CHK:(i+1))+'</div>';}).join("");
  return '<div class="bar"><div class="brand"><span class="at" aria-hidden="true">@</span><h1>Поштова місія</h1><a class="home" href="../index.html">На головну</a></div>'+
    (S.screen==="play"?'<div class="track" aria-label="Прогрес місій">'+pips+'</div>':'')+
    '<div class="barright">'+(S.screen==="play"?'<div class="score">Бали: '+S.score+' / '+total()+'</div>':'')+themeBtn()+'</div></div>';
}

/* ---------- windows ---------- */
function contactWin(m){
  var w=chosen(S.mi,"where"),n=chosen(S.mi,"cname"),e=chosen(S.mi,"cemail");var act=!stepsDone()&&S.stage==="steps"?m.steps[S.si].field:"";

   '<div class="row '+(act==="where"?"active":"")+'"><span class="k">Де</span><span class="v">'+(w?esc(w.t):'<span class="ph">обери, де зберігати</span>')+'</span></div>'+
   '<div class="row '+(act==="cname"?"active":"")+'"><span class="k">Ім\'я</span><span class="v">'+(n?esc(n.t):'<span class="ph">як підписати</span>')+'</span></div>'+
   '<div class="row '+(act==="cemail"?"active":"")+'" style="border-bottom:0"><span class="k">Ел. пошта</span><span class="v">'+(e?'<span class="mono addr">'+addr(e.t)+'</span>':'<span class="ph">адреса</span>')+'</span></div></div>';

  var act=!stepsDone()&&S.stage==="steps"?m.steps[S.si].field:"";
  var to=chosen(S.mi,"to"),sub=chosen(S.mi,"subject"),body=chosen(S.mi,"body");

  return '<div class="win"><div class="air"></div><div class="win-head"><span>Новий лист</span><span class="label">від: '+esc(nm())+'</span></div>'+
   '<div class="row '+cl("to")+'"><span class="k">Кому</span><span class="v">'+toH+'</span></div>'+
   '<div class="row '+cl("subject")+'"><span class="k">Тема</span><span class="v">'+(sub?(sub.hidden?'<span class="ph">зразок сховано</span>':esc(fill(sub.t))):'<span class="ph">обери тему</span>')+'</span></div>'+
   '<div class="bodyrow '+cl("body")+'" style="border-bottom:0">'+(body?(body.hidden?'<span class="ph">Зразок сховано. Тепер напиши СВІЙ лист у Gmail — своїми словами, за вимогами нижче.</span>':esc(fill(body.t))):'<span class="ph">текст листа</span>')+'</div></div>';
}
function inboxWin(m){
  var L=m.letter;

  app.innerHTML=topbar()+'<div class="grid"><aside class="brief"><div class="stamp">місія<b>'+(S.mi+1)+'</b>з '+MISSIONS.length+'</div>'+
    '<div class="label kind">'+kind+(m.train?' · тренування':' · пишеш сам')+'</div><h2 class="kind">'+esc(m.title)+'</h2><p>'+esc(m.brief)+'</p>'+(m.hint?'<div class="hint">'+m.hint+'</div>':'')+
    '<div class="note">Кольори в адресі: <span class="mono addr"><span class="lg">логін</span><span class="sym">@</span><span class="dm">сервіс</span></span></div></aside>'+
    '<div class="stack">'+win+panel+'</div></div>';
  var opts=$("#opts");if(opts)opts.addEventListener("click",function(e){var b=e.target.closest(".opt");if(b&&!b.disabled)choose(+b.getAttribute("data-i"));});
  var nx=$("#next");if(nx)nx.addEventListener("click",function(){if(m.gmail){S.stage="gmail";S.gm=[];S.fb=null;render();}else nextMission();});
  if(S.stage==="gmail")wireGmail(m);
}
function fbHtml(){return '<div class="fb '+(S.fb.good?"good":"bad")+'" role="status"><b>'+(S.fb.good?"Правильно!":"Не зовсім.")+'</b>'+esc(S.fb.why)+'</div>';}
function choose(i){
  var st=MISSIONS[S.mi].steps[S.si],o=st.options[i];
  if(o.ok){
    if(S.tried.length===0)S.score++;else S.misses.push({m:MISSIONS[S.mi].title,q:st.prompt,a:fill(o.t).replace(/\n+/g," "),why:o.why});
    S.done[S.mi+"."+S.si]=i;S.si++;S.tried=[];S.fb={good:true,why:o.why};render();
  } else {
    S.tried.push(i);S.fb={good:false,why:o.why};render();
    var nb=document.querySelector('.opt[data-i="'+i+'"]');if(nb)nb.classList.add("shake");
  }
}

/* ---------- gmail stage ---------- */
function letterCopies(){
  var sub=chosen(S.mi,"subject"),body=chosen(S.mi,"body"),out=[];
  if(sub)out.push(["Скопіювати тему",fill(sub.t)]);
  if(body)out.push(["Скопіювати текст",fill(body.t)]);
  return out;
}
function gmailPanel(m){
  var g=m.gmail,copies=gmCopies(m);
  var all=S.gm.length===g.tasks.length&&S.gm.every(function(x){return x;});
  return '<div class="gm"><h3><span class="gm-badge">Gmail</span>'+esc(g.title)+'</h3>'+
   '<p class="note" style="margin:0">'+(g.own?'Цей лист ти пишеш <b>сам</b>, своїми словами. Саме його оцінює вчитель.':'Тренування: можна копіювати. Виконуй кроки у своїй пошті й став позначки.')+'</p>'+
   (copies.length?'<div class="copies" id="cps">'+copies.map(function(c,i){return '<button class="copy" data-c="'+i+'">'+esc(c[0])+'</button>';}).join("")+'</div>':'')+
   (g.own?'<div class="hint"><b style="color:var(--ink)">Вимоги до твого листа</b><ul style="margin:6px 0 0;padding-left:20px">'+g.own.map(function(r){return '<li>'+esc(r)+'</li>';}).join("")+'</ul></div>':'')+
   '<ul class="tasks" id="tasks">'+g.tasks.map(function(t,i){var on=!!S.gm[i];return '<li><label class="task '+(on?"done":"")+'"><input type="checkbox" data-t="'+i+'" '+(on?"checked":"")+'><span>'+(i+1)+'. '+esc(t)+'</span></label></li>';}).join("")+'</ul>'+
   '<div class="btnrow"><button class="primary" id="gnext" '+(all?"":"disabled")+'>'+(S.mi===MISSIONS.length-1?"Завершити":"Наступна місія")+'</button>'+
   '<button class="ghost" id="later">Зроблю пізніше</button></div></div>';
}
function copyText(txt,btn){
  var done=function(){var o=btn.textContent;btn.classList.add("ok");btn.textContent="Скопійовано";setTimeout(function(){btn.classList.remove("ok");btn.textContent=o;},1500);};
  var fallback=function(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.top="-1000px";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);if(ok)done();else btn.textContent="Виділи й скопіюй вручну";};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);return;}}catch(e){}
  fallback();
}
function gmCopies(m){var g=m.gmail;return (g.copies||[]).concat(g.letter?letterCopies():[]);}
function wireGmail(m){
  var g=m.gmail,copies=gmCopies(m);
  var cps=$("#cps");if(cps)cps.addEventListener("click",function(e){var b=e.target.closest(".copy");if(b)copyText(copies[+b.getAttribute("data-c")][1],b);});
  $("#tasks").addEventListener("change",function(e){var i=+e.target.getAttribute("data-t");S.gm[i]=e.target.checked;
    e.target.parentNode.classList.toggle("done",e.target.checked);
    var all=g.tasks.every(function(t,k){return S.gm[k];});$("#gnext").disabled=!all;});
  $("#gnext").addEventListener("click",function(){S.gmDone[S.mi]=true;nextMission();});
  $("#later").addEventListener("click",function(){S.gmDone[S.mi]=false;nextMission();});
}
function nextMission(){
  var m=MISSIONS[S.mi];
  if((m.type==="compose"||S.stage==="gmail")&&!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)){
    var f=document.createElement("div");f.className="fly";f.innerHTML=ENV;document.body.appendChild(f);setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},950);
  }
  S.fb=null;S.tried=[];S.stage="steps";S.gm=[];
  if(S.mi===MISSIONS.length-1){S.screen="end";}else{S.mi++;S.si=0;}
  render();window.scrollTo(0,0);
}

/* ---------- end ---------- */
function rank(p){return p===1?"Майстер e-mail":p>=.8?"Досвідчений поштар":p>=.5?"Впевнений користувач":"Поштар-стажер";}
function renderEnd(){
  var T=total(),p=S.score/T;
  var real=MISSIONS.map(function(m,i){if(!m.gmail)return "";var ok=S.gmDone[i]===true;return '<li><span class="st '+(ok?"y":"n")+'">'+(ok?"Виконано":"Не виконано")+'</span><span>'+esc(m.title)+(m.train?' <span class="note">(тренування)</span>':' <b>(оцінюється)</b>')+'</span></li>';}).join("");
  app.innerHTML=topbar()+'<section class="hero"><div class="air"></div><div class="hero-in">'+
   '<div class="stack"><div class="label">Практичну роботу завершено</div><h2>'+esc(nm())+', твоє звання: '+rank(p)+'</h2>'+
   '<p>З першої спроби правильно '+S.score+' відповідей із '+T+'.</p>'+
   '<div class="result"><div class="post"><div><span>бали</span><b>'+S.score+'/'+T+'</b><span>'+esc(cls())+'</span></div></div></div>'+
   '<div class="label">Завдання в Gmail</div><ul class="final">'+real+'</ul>'+
   '<p class="note">Покажи цей екран учителю. Вчитель перевірить твої листи у своїй пошті.</p>'+
   '<button class="primary" id="again">Пройти знову</button></div>'+
   '<div class="stack"><div class="label">'+(S.misses.length?"Над чим попрацювати":"Помилок немає")+'</div>'+
    (S.misses.length?'<ul class="miss">'+S.misses.map(function(x){return '<li><div class="label">'+esc(x.m)+'</div><div>'+esc(x.q)+'</div><div class="ans">'+esc(x.a)+'</div><div>'+esc(x.why)+'</div></li>';}).join("")+'</ul>':'<p>Усі відповіді правильні з першої спроби. Так тримати!</p>')+
   '</div></div></section>';
  $("#again").addEventListener("click",function(){var n=S.name,c=S.cls;S=fresh();S.name=n;S.cls=c;S.screen="play";render();});
}
function render(){if(S.screen==="start")renderStart();else if(S.screen==="play")renderPlay();else renderEnd();}

function start(data){S=(data&&data.screen)?data:fresh();render();}
var hot=(window.claude&&window.claude.hot)||null;
try{if(hot&&hot.snapshot)hot.snapshot(function(){return S;});}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
